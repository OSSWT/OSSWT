<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">OSSWT technology toolbox</title>
  <desc id="desc">Four indexed rows for languages, interface, systems, and workflow tools.</desc>
  <defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#f2c14e"/><stop offset=".5" stop-color="#70b7e6"/><stop offset="1" stop-color="#51c2a8"/></linearGradient></defs>
