        <circle cx="24" cy="116" r="5" fill="#9b7bff"/><text x="40" y="122">Kotlin</text>
        <circle cx="24" cy="157" r="5" fill="#36e5ff"/><text x="40" y="163">JavaScript</text>
      </g>
      <text x="20" y="187" fill="#586987" font-size="11">logic / mobile / interaction</text>
    </g>
