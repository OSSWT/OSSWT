      <g font-size="16" fill="#d8e1f3">
        <circle cx="24" cy="75" r="5" fill="#ff7a59"/><text x="40" y="81">HTML</text>
        <circle cx="24" cy="116" r="5" fill="#59a8ff"/><text x="40" y="122">CSS</text>
        <circle cx="24" cy="157" r="5" fill="#9b7bff"/><text x="40" y="163">Bootstrap</text>
      </g>
