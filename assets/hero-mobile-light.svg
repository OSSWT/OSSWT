<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">OSSWT mobile developer identity</title>
  <desc id="desc">A light compact developer identity banner for OSSWT.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#f3f0ff"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#007f9b"/><stop offset="1" stop-color="#6846d6"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#41658a" stroke-opacity=".09"/></pattern>
  </defs>
  <rect x="1" y="1" width="798" height="598" rx="24" fill="url(#bg)" stroke="#b8c9dc" stroke-width="2"/>
  <rect x="1" y="1" width="798" height="598" rx="24" fill="url(#grid)"/>
  <path d="M24 72H776" stroke="#c6d4e4"/>
  <circle cx="34" cy="36" r="6" fill="#db3552"/><circle cx="55" cy="36" r="6" fill="#d69600"/><circle cx="76" cy="36" r="6" fill="#148b61"/>
  <text x="101" y="42" fill="#58708d" font-family="ui-monospace,Consolas,monospace" font-size="16">identity://OSSWT</text>
  <text x="754" y="42" text-anchor="end" fill="#087e57" font-family="ui-monospace,Consolas,monospace" font-size="14">● ONLINE</text>
  <text x="45" y="130" fill="#007f9b" font-family="ui-monospace,Consolas,monospace" font-size="19">&gt; HELLO, I AM</text>
  <text x="42" y="222" fill="#14233b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="96" font-weight="800" letter-spacing="6">OSSWT</text>
  <rect x="45" y="245" width="710" height="4" rx="2" fill="url(#accent)"/>
  <text x="45" y="291" fill="#304867" font-family="ui-monospace,Consolas,monospace" font-size="21" letter-spacing="2">COMPUTER SCIENCE UNDERGRADUATE</text>
  <text x="45" y="335" fill="#58708d" font-family="ui-monospace,Consolas,monospace" font-size="18">curious by default / building with intent</text>
  <g font-family="ui-monospace,Consolas,monospace">
    <g transform="translate(45 390)"><rect width="216" height="112" rx="14" fill="#fff" stroke="#c6d4e4"/><circle cx="30" cy="34" r="7" fill="#007f9b"/><text x="49" y="41" fill="#14233b" font-size="17" font-weight="700">WEB</text><text x="24" y="78" fill="#58708d" font-size="14">interfaces + logic</text></g>
    <g transform="translate(292 390)"><rect width="216" height="112" rx="14" fill="#fff" stroke="#c6d4e4"/><circle cx="30" cy="34" r="7" fill="#6846d6"/><text x="49" y="41" fill="#14233b" font-size="17" font-weight="700">MOBILE</text><text x="24" y="78" fill="#58708d" font-size="14">useful experiences</text></g>
    <g transform="translate(539 390)"><rect width="216" height="112" rx="14" fill="#fff" stroke="#c6d4e4"/><circle cx="30" cy="34" r="7" fill="#148b61"/><text x="49" y="41" fill="#14233b" font-size="17" font-weight="700">BACKEND</text><text x="24" y="78" fill="#58708d" font-size="14">systems + data</text></g>
  </g>
  <text x="45" y="552" fill="#087e57" font-family="ui-monospace,Consolas,monospace" font-size="16">MALAYSIA</text><text x="137" y="552" fill="#879bb3" font-family="ui-monospace,Consolas,monospace" font-size="16">//</text><text x="170" y="552" fill="#6846d6" font-family="ui-monospace,Consolas,monospace" font-size="16">LEARN · BUILD · ITERATE</text>
