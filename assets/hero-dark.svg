<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">OSSWT developer identity</title>
  <desc id="desc">A dark terminal-inspired profile banner for OSSWT, a Computer Science undergraduate from Malaysia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#11152a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36e5ff"/>
      <stop offset="1" stop-color="#9b7bff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8aa0c8" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="24" fill="url(#bg)" stroke="#293654" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="428" rx="24" fill="url(#grid)"/>
  <path d="M24 71H1176" stroke="#293654"/>

  <circle cx="35" cy="36" r="6" fill="#ff6b7a"/>
  <circle cx="56" cy="36" r="6" fill="#ffd166"/>
  <circle cx="77" cy="36" r="6" fill="#50e3a4"/>
  <text x="102" y="42" fill="#8290ae" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">identity://OSSWT</text>
  <text x="1163" y="42" text-anchor="end" fill="#50e3a4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">● ONLINE</text>

  <text x="58" y="138" fill="#36e5ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">&gt; HELLO, I AM</text>
  <text x="55" y="220" fill="#f2f6ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="5">OSSWT</text>
  <rect x="58" y="239" width="445" height="3" rx="2" fill="url(#accent)"/>
  <text x="58" y="279" fill="#c4cee3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" letter-spacing="2">COMPUTER SCIENCE UNDERGRADUATE</text>
  <text x="58" y="322" fill="#8290ae" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">curious by default / building with intent</text>
  <text x="58" y="370" fill="#50e3a4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">MALAYSIA</text>
  <text x="146" y="370" fill="#465675" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">//</text>
  <text x="176" y="370" fill="#9b7bff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">LEARN · BUILD · ITERATE</text>

  <g transform="translate(890 234)">
    <circle r="116" fill="#0b1224" stroke="#293654" stroke-width="2"/>
    <circle r="84" fill="none" stroke="#36e5ff" stroke-opacity=".35" stroke-dasharray="5 10"/>
    <circle r="48" fill="#101b32" stroke="#9b7bff" stroke-width="2"/>
    <circle r="13" fill="#36e5ff" filter="url(#glow)"/>
    <text y="6" text-anchor="middle" fill="#07101d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">DEV</text>

    <path d="M0-84L74-42M74-42L74 42M74 42L0 84M0 84L-74 42M-74 42L-74-42M-74-42L0-84" fill="none" stroke="#465675"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" text-anchor="middle">
      <circle cy="-84" r="7" fill="#50e3a4"/><text y="-101" fill="#c4cee3">BACKEND</text>
      <circle cx="74" cy="-42" r="7" fill="#36e5ff"/><text x="101" y="-38" fill="#c4cee3">WEB</text>
      <circle cx="74" cy="42" r="7" fill="#9b7bff"/><text x="106" y="46" fill="#c4cee3">MOBILE</text>
      <circle cy="84" r="7" fill="#ffd166"/><text y="109" fill="#c4cee3">DATA</text>
      <circle cx="-74" cy="42" r="7" fill="#ff6b7a"/><text x="-109" y="46" fill="#c4cee3">DESIGN</text>
      <circle cx="-74" cy="-42" r="7" fill="#7dd3fc"/><text x="-110" y="-38" fill="#c4cee3">LOGIC</text>
    </g>
  </g>

  <text x="1150" y="399" text-anchor="end" fill="#465675" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">PROFILE BUILD 01</text>
</svg>
