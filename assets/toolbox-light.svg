      <text x="20" y="35" fill="#007f9b" font-size="13" font-weight="700">01 / LANGUAGES</text>
      <g font-size="16" fill="#304867">
        <circle cx="24" cy="75" r="5" fill="#d69600"/><text x="40" y="81">Python</text>
        <circle cx="24" cy="116" r="5" fill="#6846d6"/><text x="40" y="122">Kotlin</text>
        <circle cx="24" cy="157" r="5" fill="#007f9b"/><text x="40" y="163">JavaScript</text>
      </g>
      <text x="20" y="187" fill="#6e829b" font-size="11">logic / mobile / interaction</text>
    </g>
    <g transform="translate(322 91)">
      <rect width="268" height="202" rx="14" fill="#ffffff" stroke="#c6d4e4"/>
      <text x="20" y="35" fill="#087e57" font-size="13" font-weight="700">02 / INTERFACE</text>
      <g font-size="16" fill="#304867">
        <circle cx="24" cy="75" r="5" fill="#d94d2f"/><text x="40" y="81">HTML</text>
        <circle cx="24" cy="116" r="5" fill="#2376c9"/><text x="40" y="122">CSS</text>
        <circle cx="24" cy="157" r="5" fill="#6846d6"/><text x="40" y="163">Bootstrap</text>
      </g>
      <text x="20" y="187" fill="#6e829b" font-size="11">structure / style / responsive UI</text>
