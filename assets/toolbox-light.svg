<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">OSSWT tech toolbox</title>
  <desc id="desc">Technologies grouped into languages, interface, systems and workflow.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#007f9b"/><stop offset="1" stop-color="#6846d6"/></linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="328" rx="20" fill="#f8fbff" stroke="#b8c9dc" stroke-width="2"/>
  <text x="35" y="45" fill="#14233b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700">TOOLBOX.INDEX</text>
  <text x="1165" y="45" text-anchor="end" fill="#58708d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">12 TOOLS / 4 CATEGORIES</text>
  <rect x="35" y="62" width="1130" height="2" fill="url(#line)"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
