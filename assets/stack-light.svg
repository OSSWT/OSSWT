      <path d="M190 12V40" stroke="#c7d1d8"/>
      <g font-size="15" fill="#40586c"><circle cx="226" cy="26" r="5" fill="#c95f43"/><text x="241" y="32">HTML</text><circle cx="466" cy="26" r="5" fill="#287fac"/><text x="481" y="32">CSS</text><circle cx="706" cy="26" r="5" fill="#665aaf"/><text x="721" y="32">Bootstrap</text></g>
    </g>
