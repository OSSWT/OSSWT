      <g font-size="15" fill="#40586c"><circle cx="226" cy="26" r="5" fill="#b57b00"/><text x="241" y="32">Python</text><circle cx="466" cy="26" r="5" fill="#287fac"/><text x="481" y="32">Kotlin</text><circle cx="706" cy="26" r="5" fill="#167d74"/><text x="721" y="32">JavaScript</text></g>
    </g>
    <g transform="translate(36 139)">
      <rect width="1128" height="52" rx="10" fill="#f5f8f8" stroke="#d9dfe2"/>
