  <text x="36" y="44" fill="#1a2b3c" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="700">TECH / INDEX</text>
  <text x="1164" y="44" text-anchor="end" fill="#62798b" font-family="ui-monospace,Consolas,monospace" font-size="13">12 TOOLS · 4 GROUPS</text>
