<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">OSSWT developer identity</title>
  <desc id="desc">A light terminal-inspired profile banner for OSSWT, a Computer Science undergraduate from Malaysia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#007f9b"/>
      <stop offset="1" stop-color="#6846d6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#41658a" stroke-opacity=".09"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="24" fill="url(#bg)" stroke="#b8c9dc" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="428" rx="24" fill="url(#grid)"/>
  <path d="M24 71H1176" stroke="#c6d4e4"/>

  <circle cx="35" cy="36" r="6" fill="#db3552"/>
  <circle cx="56" cy="36" r="6" fill="#d69600"/>
  <circle cx="77" cy="36" r="6" fill="#148b61"/>
  <text x="102" y="42" fill="#58708d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">identity://OSSWT</text>
  <text x="1163" y="42" text-anchor="end" fill="#087e57" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">● ONLINE</text>

  <text x="58" y="138" fill="#007f9b" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18">&gt; HELLO, I AM</text>
  <text x="55" y="220" fill="#14233b" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="5">OSSWT</text>
  <rect x="58" y="239" width="445" height="3" rx="2" fill="url(#accent)"/>
  <text x="58" y="279" fill="#304867" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" letter-spacing="2">COMPUTER SCIENCE UNDERGRADUATE</text>
  <text x="58" y="322" fill="#58708d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17">curious by default / building with intent</text>
  <text x="58" y="370" fill="#087e57" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">MALAYSIA</text>
  <text x="146" y="370" fill="#879bb3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">//</text>
  <text x="176" y="370" fill="#6846d6" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">LEARN · BUILD · ITERATE</text>

  <g transform="translate(890 234)">
    <circle r="116" fill="#eef5fb" stroke="#b8c9dc" stroke-width="2"/>
    <circle r="84" fill="none" stroke="#007f9b" stroke-opacity=".4" stroke-dasharray="5 10"/>
    <circle r="48" fill="#e8e5fb" stroke="#6846d6" stroke-width="2"/>
    <circle r="13" fill="#00a6c7"/>
    <text y="6" text-anchor="middle" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700">DEV</text>

    <path d="M0-84L74-42M74-42L74 42M74 42L0 84M0 84L-74 42M-74 42L-74-42M-74-42L0-84" fill="none" stroke="#9bafc5"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" text-anchor="middle">
      <circle cy="-84" r="7" fill="#148b61"/><text y="-101" fill="#304867">BACKEND</text>
      <circle cx="74" cy="-42" r="7" fill="#007f9b"/><text x="101" y="-38" fill="#304867">WEB</text>
      <circle cx="74" cy="42" r="7" fill="#6846d6"/><text x="106" y="46" fill="#304867">MOBILE</text>
      <circle cy="84" r="7" fill="#d69600"/><text y="109" fill="#304867">DATA</text>
      <circle cx="-74" cy="42" r="7" fill="#db3552"/><text x="-109" y="46" fill="#304867">DESIGN</text>
      <circle cx="-74" cy="-42" r="7" fill="#1687b0"/><text x="-110" y="-38" fill="#304867">LOGIC</text>
    </g>
  </g>

  <text x="1150" y="399" text-anchor="end" fill="#879bb3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">PROFILE BUILD 01</text>
